<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>sing-box for Windows</title
  ><link rel="icon" href="icon.svg" /><link rel="stylesheet" href="style.css" />
  <body>
    <aside>
      <h2>sing-box <small>Windows</small></h2>
      <nav></nav>
      <footer><span data-i18n="关闭窗口后继续运行">关闭窗口后继续运行</span><button id="quit"><span data-i18n="退出客户端">退出客户端</span></button></footer>
    </aside>
    <main>
      <header>
        <h1 id="title">Dashboard</h1>
        <span id="status">正在连接…</span>
      </header>
      <div id="error" role="alert"></div>
      <section id="Dashboard">
        <div class="card" id="statusCard">
          <div class="statusTop">
            <div class="statusInfo"><div class="statusLabel" id="connectionState">0</div><h2 id="profile">尚未选择配置</h2><button id="chooseProfile" data-i18n="chooseProfile">去选择配置</button></div>
            <div class="statusActions">
              <button class="primary" data-core="start" data-i18n="启动">启动</button>
              <button data-core="stop" data-i18n="停止">停止</button>
              <button data-core="restart" data-i18n="重启">重启</button>
            </div>
          </div>
          <div class="proxyRow"><label><input type="checkbox" id="proxy" /><span data-i18n="系统代理">系统代理</span></label><p data-i18n="TUN 模式待支持 · 关闭窗口后继续运行">TUN 模式待支持 · 关闭窗口后继续运行</p></div>
        </div>
        <div class="metrics">
          <article><span class="metricIcon upload" data-arrow="up"></span><span data-i18n="upload">上传速度</span><strong id="up">0 B/s</strong></article>
          <article><span class="metricIcon download" data-arrow="down"></span><span data-i18n="download">下载速度</span><strong id="down">0 B/s</strong></article>
          <article><span class="metricIcon connectionsIcon" id="countIcon"></span><span data-i18n="连接数">连接数</span><strong id="count"><span id="countValue">0</span> <span class="unit" data-i18n="countUnit">个</span></strong></article>
        </div>
        <div class="card trafficCard">
          <div class="chartLegend"><span class="upload"><i></i><span data-i18n="upload">上传速度</span></span><span class="download"><i></i><span data-i18n="download">下载速度</span></span></div>
          <div class="chartFrame">
            <div id="yAxis" class="yAxis"></div>
            <div class="plot"><svg id="chart" viewBox="0 0 800 160" preserveAspectRatio="none" aria-hidden="true">
              <polyline id="upLine" fill="none" stroke="#FF9F0A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" />
              <polyline id="downLine" fill="none" stroke="#30D158" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" />
            </svg><div id="chartEmpty" data-i18n="trafficEmpty">暂无流量数据，启动后开始采样</div></div>
            <div class="xAxis"><span>60s</span><span>50s</span><span>40s</span><span>30s</span><span>20s</span><span>10s</span><span>0s</span></div>
          </div>
          <p id="totals"><span data-i18n="累计上传 0 B / 累计下载 0 B">累计上传 0 B / 累计下载 0 B</span></p>
        </div>
        <div class="card">
          <h2><span data-i18n="节点与分组">节点与分组</span></h2>
          <button id="nodesRefresh"><span data-i18n="刷新列表">刷新列表</span></button
          ><button id="delayAll"><span data-i18n="全部测速">全部测速</span></button>
          <div id="nodes"></div>
        </div>
      </section>
      <section id="Profiles" hidden>
        <div class="card">
          <h2><span data-i18n="导入配置">导入配置</span></h2>
          <input id="name" data-i18n-placeholder="配置名称" placeholder="配置名称" /><select id="source">
            <option value="url" data-i18n="订阅 URL">订阅 URL</option>
            <option value="path" data-i18n="Windows 文件路径">Windows 文件路径</option>
            <option value="content" data-i18n="粘贴 JSON">粘贴 JSON</option></select
          ><textarea
            id="input"
            data-i18n-placeholder="输入订阅 URL、文件路径或配置内容" placeholder="输入订阅 URL、文件路径或配置内容"
          ></textarea
          ><button id="copyLink" data-i18n="copyLink">复制导入链接</button><button id="import" class="primary"><span data-i18n="导入">导入</span></button
          ><button id="clipboard"><span data-i18n="从剪贴板粘贴">从剪贴板粘贴</span></button
          ><input type="file" id="file" accept=".json,application/json" />
        </div>
        <div id="profiles"></div>
      </section>
      <section id="Connections" hidden>
        <div class="row"><input id="connectionSearch" data-i18n-placeholder="搜索连接" placeholder="搜索连接" /><button id="closeAll"><span data-i18n="关闭全部连接">关闭全部连接</span></button></div>
        <div class="card scroll">
          <table>
            <thead>
              <tr>
                <th>Host</th>
                <th><span data-i18n="规则">规则</span></th>
                <th data-i18n="network">网络</th><th data-i18n="upload">上传</th><th data-i18n="download">下载</th><th data-i18n="duration">时长</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="connections"></tbody>
          </table>
        </div>
      </section>
      <section id="Logs" hidden>
        <div class="row">
          <select id="level">
            <option value="" data-i18n="全部级别">全部级别</option>
            <option>trace</option>
            <option>debug</option>
            <option>info</option>
            <option>warn</option>
            <option>error</option>
            <option>fatal</option></select
          ><input id="search" data-i18n-placeholder="搜索日志" placeholder="搜索日志" /><label
            ><input id="autoscroll" type="checkbox" checked /><span data-i18n="自动滚动">自动滚动</span></label
          >
        </div>
        <button id="clearLogs" data-i18n="clear">清空</button><pre id="logs"></pre>
      </section>
      <section id="Settings" hidden>
        <form id="settings" class="card">
          <h2><span data-i18n="客户端设置">客户端设置</span></h2>
          <label><input type="checkbox" name="auto_start" /><span data-i18n="开机自启">开机自启</span></label
          ><label
            ><input type="checkbox" name="auto_connect" /><span data-i18n="启动后自动连接">启动后自动连接</span></label
          ><label
            ><input
              type="checkbox"
              name="allow_lan"
            /><span data-i18n="允许局域网访问代理端口">允许局域网访问代理端口</span></label
          ><label
            ><span data-i18n="本地代理端口">本地代理端口</span><input
              type="number"
              name="port"
              min="1"
              max="65535"
              required /></label
          ><label
            ><span data-i18n="订阅更新间隔（小时，0 为关闭）">订阅更新间隔（小时，0 为关闭）</span><input
              type="number"
              name="update_hours"
              min="0"
              required
          /></label>
          <label><span data-i18n="language">语言</span><select name="language" id="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
          <label><span data-i18n="theme">主题</span><select name="theme" id="theme"><option value="dark" data-i18n="dark">深色</option><option value="light" data-i18n="light">浅色</option></select></label>
          <button class="primary"><span data-i18n="保存设置">保存设置</span></button><span id="saved"></span>
        </form><div class="card row"><button id="register" data-i18n="register">注册深链</button><button id="unregister" data-i18n="unregister">取消注册</button><button id="exportLogs" data-i18n="exportLogs">导出日志</button><button id="settingsQuit" data-i18n="quit"><span data-i18n="退出客户端">退出客户端</span></button></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
